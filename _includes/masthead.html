{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item{% if page.url == link.url %} is-active{% endif %}"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="theme-toggle__icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M12 2 L13.61 8.12 L19.07 4.93 L15.88 10.39 L22 12 L15.88 13.61 L19.07 19.07 L13.61 15.88 L12 22 L10.39 15.88 L4.93 19.07 L8.12 13.61 L2 12 L8.12 10.39 L4.93 4.93 L10.39 8.12 Z M15 12 A3 3 0 1 0 9 12 A3 3 0 1 0 15 12 Z"/></svg>
    </button>
  </div>
</div>

<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('theme', 'light'); } catch (e) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        try { localStorage.setItem('theme', 'dark'); } catch (e) {}
      }
    });
  })();
</script>
